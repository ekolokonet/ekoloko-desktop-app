name: Release

# Product-code pushes to main build Windows and Linux installers and publish
# them as one GitHub Release named after package.json's "version" (2.x: the
# version is set in package.json, no longer derived from the run number). A
# push whose version already has a release builds but publishes nothing, so
# bump "version" to ship.
#
# Every installed app (1.1.x included) picks a new release up by itself
# through electron-updater within hours: merging to main IS shipping.
#
# macOS is intentionally built and uploaded manually (see docs/MAC_BUILD.md).
on:
  push:
    branches: [main]
    # Editing only this workflow must not create an otherwise empty release.
    paths-ignore:
      - ".github/workflows/release.yml"
  workflow_dispatch:

# Serialize releases so two quick commits don't race on the same tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            flag: "--win"
          - os: ubuntu-latest    # if AppImage/FUSE fails here, pin to ubuntu-22.04
            flag: "--linux"

    runs-on: ${{ matrix.os }}
    env:
      npm_config_arch: x64
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Package installers
        run: npx electron-builder ${{ matrix.flag }} --publish never

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.yml
            dist/*.blockmap

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if gh release view "v${VERSION}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "v${VERSION} is already released; bump package.json version to publish."
            exit 0
          fi
          gh release create "v${VERSION}" artifacts/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "ekoloko v${VERSION}" \
            --notes "Automated release from commit ${{ github.sha }}." \
            --latest
