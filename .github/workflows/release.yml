name: Release

# Product-code pushes to main build only Windows and Linux installers and
# publish them as a single GitHub Release. macOS is intentionally built and
# uploaded manually from the mac-support branch because the automatic runner
# produces an unreliable package.
on:
  push:
    branches: [main]
    # Editing only this workflow must not consume the next release number or
    # create an otherwise empty release.
    paths-ignore:
      - ".github/workflows/release.yml"
  workflow_dispatch:

# Serialize releases so two quick commits don't race on the same tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            flag: "--win"
          - os: ubuntu-latest    # if AppImage/FUSE fails here, pin to ubuntu-22.04
            flag: "--linux"

    runs-on: ${{ matrix.os }}
    env:
      # The supported automatic targets are x64.
      npm_config_arch: x64
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Set release version (1.0.<run number>)
        run: npm version "1.0.${{ github.run_number }}" --no-git-tag-version --allow-same-version

      - name: Compile
        run: npm run compile
        env:
          NODE_OPTIONS: --openssl-legacy-provider

      - name: Package installers
        run: npx electron-builder ${{ matrix.flag }} --publish never
        env:
          NODE_OPTIONS: --openssl-legacy-provider

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.yml
            dist/*.blockmap

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" artifacts/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "ekoloko v1.0.${{ github.run_number }}" \
            --notes "Automated release from commit ${{ github.sha }}." \
            --latest
